name: Windows CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - name: Build FlyArena
        shell: cmd
        run: build_v068.bat

      - name: Run portable behavior tests
        shell: cmd
        run: test_v068_profile_learning.bat

      - name: Scan application with Microsoft Defender
        shell: pwsh
        run: |
          $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path -LiteralPath $scanner)) {
            throw 'Microsoft Defender command-line scanner is unavailable.'
          }
          $target = (Resolve-Path 'bin\FlyArena-v0.6.8.exe').Path
          & $scanner -Scan -ScanType 3 -File $target -DisableRemediation
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Defender rejected the application (exit $LASTEXITCODE)."
          }

      # Do not upload the unsigned executable. Defender's local command-line
      # scan passes, but its Internet-origin cloud reputation scan currently
      # classifies the downloaded binary as Wacatac.B!ml. Distribution stays
      # disabled until Microsoft clears the detection, or a replacement is
      # Authenticode-signed and passes an Internet-origin verification.
