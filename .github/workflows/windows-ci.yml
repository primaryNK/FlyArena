name: Windows CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build FlyArena
        shell: cmd
        run: build_v068.bat

      - name: Run portable behavior tests
        shell: cmd
        run: test_v068_profile_learning.bat

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlyArena-Windows-x64-CI
          path: bin/FlyArena-v0.6.8.exe
          if-no-files-found: error
