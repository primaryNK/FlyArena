name: Tagged Source Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - name: Verify source-available license
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath LICENSE)) {
            throw 'Public release blocked: LICENSE is missing.'
          }
          if (-not (Select-String -LiteralPath LICENSE -SimpleMatch 'FASL-1.0' -Quiet)) {
            throw 'Public release blocked: expected FASL-1.0 license marker.'
          }

      - name: Build and test
        shell: cmd
        run: |
          call build_v068.bat
          if errorlevel 1 exit /b 1
          call test_v068_profile_learning.bat

      - name: Scan application with Microsoft Defender
        shell: pwsh
        run: |
          $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path -LiteralPath $scanner)) {
            throw 'Microsoft Defender command-line scanner is unavailable.'
          }
          $target = (Resolve-Path 'bin\FlyArena-v0.6.8.exe').Path
          & $scanner -Scan -ScanType 3 -File $target -DisableRemediation
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Defender rejected the application (exit $LASTEXITCODE)."
          }

      - name: Build clean-source ZIP
        shell: pwsh
        run: |
          ./tools/stage_public_source.ps1 -Version '${{ github.ref_name }}'

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $sourceArchive = "dist/FlyArena-$tag-Source.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $sourceArchive dist/SHA256SUMS.txt --clobber
          } else {
            gh release create $tag $sourceArchive dist/SHA256SUMS.txt --generate-notes --verify-tag
          }
