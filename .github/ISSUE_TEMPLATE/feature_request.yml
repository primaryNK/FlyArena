name: Feature request
description: Propose a gameplay, learning, or research-facing improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Parameter category
      options:
        - Measured anatomy
        - Inferred physiology
        - Gameplay/model assumption
        - Presentation/tooling only
    validations:
      required: true

